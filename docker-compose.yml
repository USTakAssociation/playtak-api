name: playtak-services

services:
  playtak-api:
    container_name: playtak-api
    platform: linux/amd64
    build:
      context: ./api
      target: development
    ports:
      - 3004:3004
      - 9231:9231
    volumes:
      - type: bind
        source: ./api/
        target: /usr/src/app
      # The bind mount above replaces the whole directory, which hides the
      # node_modules the Dockerfile built for Alpine/musl — leaving the
      # container to load the host's binaries (wrong libc, so better-sqlite3
      # fails with "fcntl64: symbol not found") or, on a fresh clone with no
      # host install, no node_modules at all. This re-covers just that path
      # with the image's copy.
      #
      # It is an anonymous volume, so it persists: after changing dependencies,
      # `docker compose down -v` (or `up --build --renew-anon-volumes`) is
      # needed for the container to pick them up.
      - /usr/src/app/node_modules
      - type: bind
        source: ./playtakdb
        target: /playtakdb
    command: npm run start:debug
    networks:
      - webnet
    # depends_on:
    #   - playtak-db

  playtak-server:
    container_name: playtak-server
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - 10000:10000
      - 9999:9999
      - 9998:9998
    volumes:
      - type: bind
        source: ./playtakdb
        target: /playtakdb

    networks:
      - webnet
    # depends_on:
    #   - playtak-db

  # playtak-db:
